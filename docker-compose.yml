services:
  sudoku-camp:
    build: .
    container_name: sudoku-training-camp
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/sudoku.db
      # 认证签名密钥，务必设置为随机长字符串：openssl rand -hex 32
      - AUTH_SECRET=${AUTH_SECRET:-change-me-use-openssl-rand}
    volumes:
      - sudoku-data:/app/data

volumes:
  sudoku-data:
